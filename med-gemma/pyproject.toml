[project]
name = "med-gemma"
version = "0.1.0"
description = "MedGuard: on-device medical prescription & drug-interaction inspector (India-focused, MedGemma-powered)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # --- model runtime (MedGemma 4B multimodal, local T4) ---
    "torch>=2.5",
    "transformers>=4.50",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "sentencepiece>=0.2",
    "protobuf>=4.0",
    # --- app / data ---
    "pydantic>=2.0",
    "rapidfuzz>=3.0",
    "requests>=2.31",
    "pillow>=10.0",
    "chainlit>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medguard"]
